<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autos Roquero — New Website Proposal</title>

  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #5b6875;
      --primary: #2e6f95;
      --primary-dark: #245874;
      --line: #e7e2dc;
      --shadow: 0 20px 50px rgba(31, 41, 51, 0.08);
      --radius-lg: 24px;
      --container: 1180px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: var(--text);
    }

    .container {
      width: min(var(--container), calc(100% - 40px));
      margin: 0 auto;
    }

    /* HERO */

    .hero {
      color: white;
      padding-bottom: 60px;
      background:
        linear-gradient(90deg, rgba(20,50,70,0.9), rgba(46,111,149,0.4)),
        url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1600&q=80') center/cover;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    .brand img {
      width: 140px;
      background: white;
      padding: 4px;
      border-radius: 8px;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
      padding-top: 40px;
    }

    .hero h1 {
      font-size: 3rem;
      margin: 10px 0;
    }

    .hero-car {
      width: 100%;
      max-width: 420px;
    }

    /* TRUST */

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(6,1fr);
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      margin-top: -40px;
    }

    .trust-item {
      text-align: center;
      padding: 20px;
      border-right: 1px solid var(--line);
    }

    .trust-item:last-child { border: none; }

    .trust-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: rgba(46,111,149,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .trust-icon svg {
      width: 22px;
      fill: var(--primary);
    }

    /* FLEET */

    .fleet {
      padding: 60px 0;
      background: var(--bg);
    }

    .fleet-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
    }

    .card-body {
      padding: 16px;
    }

    .price {
      font-weight: bold;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .hero-content { grid-template-columns: 1fr; }
      .fleet-grid { grid-template-columns: 1fr; }
      .trust-grid { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>

<body>

<header class="hero">
  <div class="container">

    <div class="nav">
      <div class="brand">
        <img src="https://www.autosroquero.com/gallery_gen/9ef29b053b1bd9d8d48f21e3fe181014_149x115.jpg">
      </div>
      <a href="#" style="color:white;">Book now</a>
    </div>

    <div class="hero-content">
      <div>
        <h1>Car hire in Mallorca, made simple</h1>
        <p>Full insurance, unlimited km, no hidden fees.</p>
      </div>
      <img class="hero-car" src="https://www.autosroquero.com/gallery_gen/c87e4f91f38c215a63a2336c10724acc_504.84848484848x340.png">
    </div>

  </div>
</header>

<div class="container">
  <div class="trust-grid">

    <div class="trust-item">
      <div class="trust-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2l7 3v6c0 5-4 10-7 11-3-1-7-6-7-11V5z"/></svg>
      </div>
      <strong>Insurance</strong>
    </div>

    <div class="trust-item">
      <div class="trust-icon">
        <svg viewBox="0 0 24 24"><path d="M3 13l2-5h14l2 5v5h-2a2 2 0 1 1-4 0H9a2 2 0 1 1-4 0H3z"/></svg>
      </div>
      <strong>Unlimited km</strong>
    </div>

    <div class="trust-item"><div class="trust-icon">👥</div><strong>2 drivers</strong></div>
    <div class="trust-item"><div class="trust-icon">💶</div><strong>No fees</strong></div>
    <div class="trust-item"><div class="trust-icon">✈️</div><strong>Airport</strong></div>
    <div class="trust-item"><div class="trust-icon">🏝️</div><strong>Local</strong></div>

  </div>
</div>

<section class="fleet">
  <div class="container">
    <h2>Our fleet</h2>

    <div class="fleet-grid">

      <div class="card">
        <img src="https://www.autosroquero.com/gallery_gen/074583e395a4886f1fddf4f9c8d885e9_460x270.png">
        <div class="card-body">
          <h3>Fiat Panda</h3>
          <p class="price">€25/day</p>
        </div>
      </div>

      <div class="card">
        <img src="https://www.autosroquero.com/gallery_gen/c87e4f91f38c215a63a2336c10724acc_504.84848484848x340.png">
        <div class="card-body">
          <h3>Panda Sport</h3>
          <p class="price">€29/day</p>
        </div>
      </div>

      <div class="card">
        <img src="https://www.autosroquero.com/gallery_gen/ae958d328837c16895be103e1a76e03c_324x180.png">
        <div class="card-body">
          <h3>Fiat 500</h3>
          <p class="price">€34/day</p>
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
